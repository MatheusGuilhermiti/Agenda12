<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Sites Favoritos</title>

    <style>
        
        .container {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        
        .site {
        display: flex;
        flex-direction: column;
        align-items: center;
        
        }

        .site img {
        width: 90px;
        height: 90px;
        object-fit: contain;
        }

        .site p {
        margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>Meus Sites Favoritos: Matheus Henrique Santos Guilhermiti</h1>

    <div class="container">

        
        <div class="site">
            <H2>Google</H2>
            <a href="https://www.google.com/" target="_blank">
                <img src="logos/chrome.png" alt="Google Chrome">
            </a>

            <p><a href="https://www.google.com/" target="_blank">Acessar Google</a></p>
        </div>

        
        <div class="site">
            <H2>YouTube</H2>
            <a href="https://www.youtube.com/" target="_blank">
                <img src="logos/youtube.png" alt="YouTube">
            </a>

            <p><a href="https://www.youtube.com/" target="_blank">Acessar YouTube</a></p>
        </div>

        
        <div class="site">
            <H2>TikTok</H2>
            <a href="https://www.tiktok.com/" target="_blank">
                <img src="logos/tiktok.png" alt="TikTok">
            </a>

            <p><a href="https://www.tiktok.com/" target="_blank">Acessar TikTok</a></p>
        </div>

        
        <div class="site">
            <H2>Roblox</H2>
            <a href="https://www.roblox.com/pt/home" target="_blank">
                <img src="logos/roblox.png" alt="Roblox">
            </a>

            <p><a href="https://www.roblox.com/pt/home" target="_blank">Acessar Roblox</a></p>
        </div>

        
        <div class="site">
            <H2>Discord</H2>
            <a href="https://discord.com/channels/@me" target="_blank">
                <img src="logos/DISCORD.png" alt="Discord" class="discord">
            </a>

            <p><a href="https://discord.com/channels/@me" target="_blank">Acessar Discord</a></p>
        </div>

    </div>
</body>
</html>
